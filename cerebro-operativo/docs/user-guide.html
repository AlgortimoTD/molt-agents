llow it once, start to finish."},"chapters":[{"id":"instalar","title":{"es":"Instala el cerebro","en":"Install the brain"},"goal":{"es":"Al terminar, el cerebro vive en tu carpeta de Drive, sabe quién es tu empresa y ya procesó su primera reunión.","en":"When you finish, the brain lives in your Drive folder, knows who your company is and has processed its first meeting."},"cards":["getting-started"],"before":[{"es":"Una cuenta de Claude con acceso a Code, con la sesión abierta en la app de escritorio de Claude: la pestaña Code se ve junto a Chat.","en":"A Claude account with Code access, signed in on the Claude desktop app: the Code tab shows next to Chat."},{"es":"Una cuenta de Google con Google Drive para escritorio instalado y sincronizando: tu Drive aparece como una unidad en el computador.","en":"A Google account with Google Drive for desktop installed and syncing: your Drive shows as a drive on your computer."},{"es":"Nada más. No abres una terminal en ningún momento ni instalas otra cosa.","en":"Nothing else. You never open a terminal or install anything else."}],"steps":[{"do":{"es":"Crea en Drive la carpeta donde vivirá el cerebro, por ejemplo \\"Cerebro Mi Empresa\\", y márcala como disponible sin conexión (clic derecho sobre la carpeta).","en":"Create the folder in Drive where the brain will live, for example \\"My Company brain\\", and mark it available offline (right-click on the folder)."},"appears":{"es":"Una carpeta vacía en tu Drive, con la marca de disponible sin conexión.","en":"An empty folder in your Drive, marked available offline."},"check":{"es":"La carpeta se ve desde el explorador de archivos del computador, dentro de la unidad de Google Drive.","en":"You can see the folder in your computer\'s file explorer, inside the Google Drive drive."}},{"do":{"es":"Abre la app de escritorio de Claude, entra a la sección Code, elige \\"Abrir proyecto\\" y selecciona esa carpeta.","en":"Open the Claude desktop app, go to the Code section, choose \\"Open project\\" and pick that folder."},"appears":{"es":"Un chat vacío con el nombre de la carpeta como proyecto.","en":"An empty chat with the folder\'s name as the project."},"check":{"es":"El nombre de tu carpeta aparece como el proyecto abierto.","en":"Your folder\'s name shows as the open project."}},{"do":{"es":"Pega este mensaje tal cual en el chat y aprueba los permisos que te pida (o pon la app en permisos automáticos).","en":"Paste this message as it is in the chat and approve the permissions it asks for (or switch the app to automatic permissions)."},"say":{"es":"Instala el cerebro operativo de mi empresa. Viene del marketplace AlgortimoTD/molt-agents, plugin cerebro-operativo. Deja listo todo lo que necesite para funcionar y avísame cuando esté, sin explicarme los detalles técnicos.","en":"Install my company\'s operating brain. It comes from the marketplace AlgortimoTD/molt-agents, plugin cerebro-operativo. Get everything it needs ready and tell me when it is done, without explaining the technical details."},"appears":{"es":"El cerebro se instala solo y al final responde \\"listo\\".","en":"The brain installs itself and at the end tells you it is done."},"check":{"es":"Respondió \\"listo\\" sin pedirte que corras ningún comando ni que crees nada.","en":"It said it is done without asking you to run any command or create anything."}},{"do":{"es":"Escribe en el mismo chat:","en":"Say, in the same chat:"},"say":{"es":"quiero instalarlo","en":"install the brain"},"appears":{"es":"La primera pregunta: en qué idioma trabajará el cerebro, español o inglés. La respuesta es definitiva: carpetas, playbooks, bitácora y respuestas quedan en ese idioma.","en":"The first question: which language the brain will work in, Spanish or English. The answer is final: folders, playbooks, decision log and answers stay in that language."},"check":{"es":"Te preguntó el idioma antes de crear cualquier archivo.","en":"It asked the language before creating any file."}},{"do":{"es":"Responde el idioma y, enseguida, en qué idioma van los borradores para tus clientes.","en":"Answer the language and, right after, which language drafts for your clients should use."},"appears":{"es":"Un mapa en una frase de las seis cosas que va a hacer: la carpeta en Drive, tus documentos, la entrevista, la rutina diaria, una reunión de arranque y el inventario final.","en":"A one-sentence map of the six things it will do: the Drive folder, your documents, the interview, the daily routine, a kickoff meeting and the closing inventory."},"check":{"es":"Escuchaste las seis cosas y no te nombró ninguna herramienta.","en":"You heard the six things and it named no tool."}},{"do":{"es":"Cuando te lo pida, autoriza la conexión con Google Drive en la app (Configuración, Conectores, Google Drive). Es lo que deja que el celular y la rutina lleguen a la carpeta.","en":"When it asks, authorize the Google Drive connection in the app (Settings, Connectors, Google Drive). It is what lets the phone and the routine reach the folder."},"appears":{"es":"Dentro de tu carpeta aparece la carpeta de documentos, con un archivo de instrucciones.","en":"Inside your folder, the documents folder appears, with an instructions file."},"check":{"es":"La carpeta de documentos ya existe en Drive.","en":"The documents folder now exists in Drive."}},{"do":{"es":"Entrega lo que ya tengan escrito: manuales, procedimientos, plantillas, presentaciones de inducción. Déjalos en la carpeta de documentos o pégalos en el chat. \\"No tenemos nada\\" también es una respuesta válida.","en":"Hand over what you already have written: manuals, procedures, templates, onboarding decks. Drop them in the documents folder or paste them in the chat. \\"We have nothing\\" is also a valid answer."},"appears":{"es":"Una línea por documento con lo que tomó de cada uno, y un playbook por proceso escrito desde el documento, con su fecha.","en":"One line per document with what it took from each, and one playbook per process written from the document, with its date."},"check":{"es":"En la carpeta de playbooks hay un archivo por proceso, y cada uno cita el documento de donde salió y su fecha.","en":"The playbooks folder has one file per process, and each cites the document it came from and its date."}},{"do":{"es":"Responde la entrevista por bloques: quiénes son, las personas y sus roles (una sola persona responsable del cerebro), valores y no negociables, procesos, uno o dos casos, clientes clave, reuniones, zona horaria, y en qué cuenta y a qué hora corre la rutina.","en":"Answer the interview in blocks: who you are, the people and their roles (exactly one brain owner), values and non-negotiables, processes, one or two cases, key clients, meetings, time zone, and which account runs the routine and when."},"appears":{"es":"Los archivos de configuración se van llenando, y lo que no dijiste en firme queda marcado por confirmar, nunca inventado.","en":"The configuration files fill in, and what you did not say firmly stays marked as pending confirmation, never guessed."},"check":{"es":"El archivo de fuentes de la configuración tiene la tabla de roles con exactamente una persona responsable.","en":"The sources file in the configuration has the roles table with exactly one brain owner."}},{"do":{"es":"Lee la muestra de tu guía de voz que te presenta y dile si suena a ustedes.","en":"Read the sample of your voice guide it shows you and tell it whether it sounds like you."},"appears":{"es":"El archivo de voz en la configuración, con el tono, ejemplos reales y las frases que no usan.","en":"The voice file in the configuration, with the tone, real examples and the phrases you never use."},"check":{"es":"El archivo de voz existe y tú diste el visto bueno o le dijiste qué falta.","en":"The voice file exists and you approved it or told it what is missing."}},{"do":{"es":"Confirma la hora de la rutina diaria cuando te la proponga (después de la reunión principal, con margen).","en":"Confirm the time of the daily routine when it proposes one (after the main meeting, with margin)."},"appears":{"es":"Una tarea programada en la cuenta que elegiste, de lunes a viernes a esa hora. Si no usan Fathom, te explica la bandeja de entrada de reuniones y la programa igual.","en":"A scheduled task in the account you chose, on working days at that time. If you do not use Fathom, it explains the meetings inbox and schedules it anyway."},"check":{"es":"Te dijo que la rutina quedó programada, con los días y la hora.","en":"It told you the routine is scheduled, with the days and the time."}},{"do":{"es":"Graba la reunión de arranque (45 a 60 minutos) siguiendo el guion que te deja, y entrégale la transcripción. Si no puedes grabarla ahora, dale las notas de tu última reunión.","en":"Record the kickoff meeting (45 to 60 minutes) following the script it leaves you, and hand it the transcript. If you cannot record it now, give it the notes of your last meeting."},"appears":{"es":"Cuatro cosas: el archivo de la reunión, líneas nuevas en la bitácora, las secciones de playbook corregidas con su historial y el resumen de la ingesta.","en":"Four things: the meeting file, new lines in the decision log, the corrected playbook sections with their history, and the ingest summary."},"check":{"es":"Las cuatro existen en la carpeta. Si diste otra reunión, la memoria tiene una línea de arranque pendiente.","en":"All four exist in the folder. If you gave another meeting, the memory file has a pending kickoff line."}},{"do":{"es":"Escucha el inventario final (qué sabe el cerebro y qué le falta) y aplica con tus propios clics la lista de permisos de Drive que te da.","en":"Listen to the closing inventory (what the brain knows and what it lacks) and apply, with your own clicks, the Drive permissions list it gives you."},"appears":{"es":"El inventario en lenguaje normal, una línea por vacío en la memoria del cerebro y una lista corta de permisos: responsable y editores editan, consulta solo lee, la cuenta de la rutina edita.","en":"The inventory in plain words, one line per gap in the brain\'s memory file, and a short permissions list: owner and editors edit, viewers read, the routine\'s account edits."},"check":{"es":"La carpeta está compartida con esas personas y con la cuenta de la rutina, y el cerebro cerró diciéndote qué puedes pedirle desde ahora.","en":"The folder is shared with those people and with the routine\'s account, and the brain closed by telling you what you can ask it from now on."}}],"if_not":[{"when":{"es":"Te pide correr un comando, crear una carpeta o nombra una herramienta.","en":"It asks you to run a command, create a folder, or names a tool."},"then":{"es":"Ese no es el camino. En el mismo chat, con tu carpeta abierta como proyecto, vuelve a escribir \\"quiero instalarlo\\".","en":"That is not the path. In the same chat, with your folder open as the project, say \\"install the brain\\" again."}},{"when":{"es":"Dice que ya existe un cerebro y te ofrece revisarlo.","en":"It says a brain already exists and offers to review it."},"then":{"es":"Ya hay una carpeta instalada en este computador o en tu memoria de Claude. Nunca crea un segundo cerebro: acepta la revisión o pídele lo que falta.","en":"There is already an installed folder on this computer or in your Claude memory. It never creates a second brain: accept the review or ask for what is missing."}},{"when":{"es":"Google Drive no aparece como unidad en el computador.","en":"Google Drive does not show as a drive on the computer."},"then":{"es":"Sigue igual: el cerebro trabaja en modo nube por la conexión con Drive. Instala Google Drive para escritorio después para trabajar desde el computador.","en":"Carry on: the brain works in cloud mode through the Drive connection. Install Google Drive for desktop later to work from the computer."}},{"when":{"es":"Un documento no se pudo abrir (una imagen escaneada, un archivo protegido).","en":"A document could not be opened (a scanned image, a protected file)."},"then":{"es":"Te dice cuál. Pásalo en otro formato; si nunca llega, queda en la lista de vacíos del inventario.","en":"It tells you which. Hand it over in another format; if it never arrives, it stays on the inventory\'s gaps list."}}]},{"id":"empresa-de-ejemplo","title":{"es":"Prueba con la empresa de ejemplo","en":"Try the sample company"},"goal":{"es":"Tienes una carpeta aparte con una empresa inventada, lista para probar todo sin tocar datos reales.","en":"You have a separate folder with a made-up company, ready to test everything without touching real data."},"cards":["try-the-sample-company"],"steps":[{"do":{"es":"Con tu cerebro abierto, escribe:","en":"With your brain open, say:"},"say":{"es":"puebla el cerebro con la empresa de ejemplo","en":"seed the demo organization"},"appears":{"es":"Copia en tu Drive una agencia de diseño inventada, Faro Estudio, como \\"Cerebro (demo)\\", al lado de tu cerebro y nunca adentro. Todo en ella es ficticio.","en":"It copies into your Drive a made-up design agency, Faro Estudio, as \\"Cerebro (demo)\\", next to your brain and never inside it. Everything in it is fictional."},"check":{"es":"En Drive existe \\"Cerebro (demo)\\" con carpetas de playbooks, decisiones, casos, reuniones, documentos y configuración.","en":"\\"Cerebro (demo)\\" exists in Drive with folders for playbooks, decisions, cases, meetings, documents and configuration."}},{"do":{"es":"Abre la carpeta de reuniones de la demo y su bandeja de entrada.","en":"Open the demo\'s meetings folder and its inbox."},"appears":{"es":"Una reunión ya procesada (8 de septiembre) con su resumen, y en la bandeja de entrada una transcripción por procesar, la del 15 de septiembre.","en":"One meeting already processed (September 8) with its summary, and in the inbox one transcript waiting, the one from September 15."},"check":{"es":"La bitácora de decisiones tiene tres líneas y la bandeja de entrada tiene exactamente un archivo.","en":"The decision log has three lines and the inbox has exactly one file."}},{"do":{"es":"En Code, abre \\"Cerebro (demo)\\" como proyecto. Los capítulos que siguen se hacen ahí.","en":"In Code, open \\"Cerebro (demo)\\" as the project. The following chapters happen there."},"appears":{"es":"Un chat nuevo sobre la carpeta de la demo.","en":"A new chat on the demo folder."},"check":{"es":"El proyecto abierto se llama \\"Cerebro (demo)\\".","en":"The open project is called \\"Cerebro (demo)\\"."}}],"if_not":[{"when":{"es":"Elegiste inglés y te avisa que la demo está en español.","en":"You chose English and it warns you the demo is in Spanish."},"then":{"es":"Es normal: la empresa de ejemplo solo existe en español. Sigue con ella para probar el mecanismo, o espera la demo en inglés.","en":"That is expected: the sample company only exists in Spanish. Go on with it to test the mechanism, or wait for the English demo."}},{"when":{"es":"No encuentras la carpeta de la demo en el computador.","en":"You cannot find the demo folder on your computer."},"then":{"es":"Espera a que Drive termine de sincronizar, o ábrela desde drive.google.com.","en":"Wait for Drive to finish syncing, or open it from drive.google.com."}}]},{"id":"procesar-reuniones","title":{"es":"Convierte una reunión en decisiones","en":"Turn a meeting into decisions"},"goal":{"es":"Viste una reunión volverse decisiones con fecha, un playbook corregido con historial y un resumen, y comprobaste que repetirla no duplica nada.","en":"You watched a meeting become dated decisions, a playbook corrected with history and a summary, and confirmed that repeating it duplicates nothing."},"cards":["meetings-every-day","add-a-meeting-by-hand"],"steps":[{"do":{"es":"Escribe:","en":"Say:"},"say":{"es":"procesa el transcript que está en entrada","en":"process the transcript in the inbox"},"appears":{"es":"El archivo de la reunión del 15 de septiembre; tres líneas nuevas en la bitácora (aplicada, por confirmar, abierta); la sección \\"Llamada de descubrimiento\\" del playbook de propuestas reescrita, con el texto anterior bajo Historial; y el resumen de la ingesta en salidas.","en":"The September 15 meeting file; three new lines in the decision log (applied, pending confirmation, open); the \\"Llamada de descubrimiento\\" section of the proposals playbook rewritten, with the previous text under Historial; and the ingest summary in the outputs folder."},"check":{"es":"La bitácora pasó de tres líneas a seis y en salidas hay un archivo de ingesta con fecha 2026-09-15.","en":"The decision log went from three lines to six and the outputs folder has an ingest file dated 2026-09-15."}},{"do":{"es":"Vuelve a escribir la misma frase.","en":"Say the same phrase again."},"appears":{"es":"Te dice que no hay nada nuevo por procesar: esa reunión ya entró.","en":"It tells you there is nothing new to process: that meeting already went in."},"check":{"es":"La bitácora sigue en seis líneas y no apareció ningún archivo nuevo.","en":"The decision log still has six lines and no new file appeared."}},{"do":{"es":"Suma una reunión a mano: guarda cualquier texto de una conversación como archivo con la fecha adelante (por ejemplo 2026-09-22-llamada-con-cliente.md) y déjalo en la bandeja de entrada de reuniones. Luego escribe:","en":"Add a meeting by hand: save any conversation text as a file with the date first (for example 2026-09-22-client-call.md) and drop it in the meetings inbox. Then say:"},"say":{"es":"procesa el transcript que dejé en entrada","en":"process the transcript I left in the inbox"},"appears":{"es":"Las mismas cuatro cosas para esa reunión. Si el texto no trae minutos, te lo dice y cita la reunión sin minuto.","en":"The same four things for that meeting. If the text has no minutes, it says so and cites the meeting without a minute."},"check":{"es":"En reuniones hay un archivo nuevo con tu fecha y la bitácora creció.","en":"The meetings folder has a new file with your date and the decision log grew."}},{"do":{"es":"Pide la corrida diaria a mano:","en":"Ask for the daily run by hand:"},"say":{"es":"corre la ingesta ahora","en":"run the ingestion now"},"appears":{"es":"Hace lo mismo que la rutina de cada día: lee hasta dónde llegó, busca reuniones grabadas nuevas y procesa las que encuentre, o te dice que no había nada.","en":"It does what the daily routine does: reads how far it got, looks for new recorded meetings and processes what it finds, or tells you there was nothing."},"check":{"es":"Te dijo qué encontró o que no había nada nuevo, y nada se procesó dos veces.","en":"It told you what it found or that there was nothing new, and nothing was processed twice."}}],"if_not":[{"when":{"es":"Un día no aparece el archivo de ingesta en salidas.","en":"One day no ingest file appears in the outputs folder."},"then":{"es":"Casi siempre no había nada que ingerir: sin reunión grabada no hay archivo. Espera a la corrida del día siguiente, que recoge lo pendiente, o escribe \\"corre la ingesta ahora\\".","en":"Almost always there was nothing to ingest: no recorded meeting, no file. Wait for the next day\'s run, which picks up what is pending, or say \\"run the ingestion now\\"."}},{"when":{"es":"Dos días seguidos sin archivo y sí hubo reuniones grabadas.","en":"Two days in a row without a file, and there were recorded meetings."},"then":{"es":"La transcripción no quedó compartida con el equipo de Fathom, la conexión de Fathom venció o la tarea se apagó. Escríbele a Molt con la fecha de la reunión que falta. No escribas los playbooks a mano mientras tanto.","en":"The transcript was not shared with the Fathom team, the Fathom connection expired, or the task was switched off. Write to Molt with the date of the missing meeting. Do not write the playbooks by hand meanwhile."}}]},{"id":"preguntar","title":{"es":"Pregúntale al cerebro","en":"Ask the brain"},"goal":{"es":"Recibiste respuestas con valores, casos y la fuente de cada afirmación, y viste al cerebro decir \\"esto no está escrito\\" en vez de inventar.","en":"You received answers with values, cases and the source of every claim, and watched the brain say \\"this is not written\\" instead of inventing."},"cards":["ask-how-to-handle","ask-what-you-decided"],"steps":[{"do":{"es":"Pregúntale por una situación difícil:","en":"Ask it about a hard situation:"},"say":{"es":"¿cómo manejamos un cliente que maltrata al equipo?","en":"how do we handle a client who mistreats the team?"},"appears":{"es":"Primero la recomendación; después el no negociable que aplica, el caso Nébula de 2025, el playbook de escalaciones, y el archivo y la fecha detrás de cada afirmación.","en":"The recommendation first; then the non-negotiable that applies, the 2025 Nébula case, the escalations playbook, and the file and date behind every claim."},"check":{"es":"Cada afirmación nombra un archivo y una fecha. Ninguna viene sin fuente.","en":"Every claim names a file and a date. None comes without a source."}},{"do":{"es":"Pregunta qué decidieron:","en":"Ask what you decided:"},"say":{"es":"¿qué decidimos sobre las propuestas?","en":"what did we decide about proposals?"},"appears":{"es":"Las líneas de la bitácora del 8 y del 15 de septiembre, cada una con su reunión y su minuto, y la sección del playbook que cambió.","en":"The decision log lines of September 8 and 15, each with its meeting and minute, and the playbook section that changed."},"check":{"es":"Aparecen las dos fechas y el minuto de cada decisión.","en":"Both dates appear, with the minute of each decision."}},{"do":{"es":"Pregunta algo que la empresa de ejemplo no tiene escrito:","en":"Ask something the sample company has not written down:"},"say":{"es":"¿cuál es nuestra política de descuentos?","en":"what is our policy on discounts?"},"appears":{"es":"Te dice que eso no está escrito en la carpeta y te ofrece registrarlo cuando lo decidan.","en":"It tells you that is not written in the folder and offers to record it when you decide it."},"check":{"es":"No inventó una política. La respuesta dice que no está escrito.","en":"It invented no policy. The answer says it is not written."}}]},{"id":"escribir-con-tu-voz","title":{"es":"Escribe con tu voz","en":"Write in your voice"},"goal":{"es":"Tienes un borrador con el tono de la empresa, marcado para revisar, y nada salió enviado.","en":"You have a draft in the company\'s tone, marked for review, and nothing was sent."},"cards":["write-in-your-voice"],"steps":[{"do":{"es":"Pega un correo corto y plano, por ejemplo uno que avise a un cliente que la propuesta llega el viernes, y escribe:","en":"Paste a short, flat email, for example one telling a client the proposal arrives on Friday, and say:"},"say":{"es":"escribe este correo con nuestra voz","en":"write this email in our voice"},"appears":{"es":"El mismo correo reescrito siguiendo la guía de voz de la empresa, con la marca \\"para revisar antes de enviar\\".","en":"The same email rewritten following the company\'s voice guide, marked \\"review before sending\\"."},"check":{"es":"El borrador lleva la marca de revisar, y no se envió nada a nadie.","en":"The draft carries the review mark, and nothing was sent to anyone."}},{"do":{"es":"En tu cerebro real, si la guía de voz quedó con vacíos en la instalación, pídele que la construya desde lo que ya publicaron:","en":"In your real brain, if the voice guide was left with gaps at install, ask it to build it from what you already published:"},"say":{"es":"extrae nuestra voz de marca","en":"extract our brand voice"},"appears":{"es":"El archivo de voz reescrito desde tu sitio y tus canales: el tono con evidencia, pares de sí y no tomados de frases reales, frases prohibidas y ejemplos reescritos.","en":"The voice file rewritten from your site and channels: the tone with evidence, do and do-not pairs from real sentences, banned phrases and rewrite samples."},"check":{"es":"El archivo de voz en la configuración tiene ejemplos con frases reales de ustedes.","en":"The voice file in the configuration has examples with real sentences of yours."}}]},{"id":"corregir-y-agregar","title":{"es":"Corrige y agrega conocimiento","en":"Correct and add knowledge"},"goal":{"es":"Corregiste una decisión sin borrar nada, sumaste un documento viejo como playbook y registraste un caso con su lección.","en":"You corrected a decision without deleting anything, added an old document as a playbook and recorded a case with its lesson."},"cards":["fix-a-decision","add-an-old-document","tell-it-a-case"],"steps":[{"do":{"es":"Corrige la decisión que entró en el capítulo anterior, en lenguaje normal, diciendo qué quedó mal y cómo debe quedar:","en":"Correct the decision that went in during the earlier chapter, in plain words, saying what is wrong and how it should read:"},"say":{"es":"la decisión del 15 de septiembre sobre la llamada de descubrimiento quedó mal, corrígela","en":"the September 15 decision about the discovery call is wrong, fix it"},"appears":{"es":"Una línea nueva en la bitácora que corrige la anterior, con tu nombre en \\"Pedido por\\"; el playbook de vuelta al texto correcto, con el equivocado en Historial; y te muestra cómo quedó antes de darlo por hecho.","en":"A new line in the decision log correcting the previous one, with your name under \\"Pedido por\\"; the playbook back to the right text, with the wrong one under Historial; and it shows you the result before calling it done."},"check":{"es":"La bitácora tiene una línea más y ninguna menos. La vieja sigue ahí.","en":"The decision log has one more line and none fewer. The old one is still there."}},{"do":{"es":"Deja un documento que ya tenían (un manual, un procedimiento) en la carpeta de documentos y escribe:","en":"Drop a document you already had (a manual, a procedure) in the documents folder and say:"},"say":{"es":"procesa el documento que dejé en documentos","en":"process the document I left in documents"},"appears":{"es":"El playbook de ese proceso, escrito desde el documento con su fecha y su nombre como origen, sin modernizarlo; el original no se toca. Si contradice algo escrito, te muestra las dos versiones y pregunta cuál vale.","en":"That process\'s playbook, written from the document with its date and name as the origin, not modernized; the original is untouched. If it contradicts something written, it shows both versions and asks which holds."},"check":{"es":"El playbook nuevo cita el nombre del documento y su fecha, y el documento original sigue igual.","en":"The new playbook cites the document\'s name and date, and the original document is unchanged."}},{"do":{"es":"Cuéntale un caso hablado, sin estructura: qué cliente, qué pasó, qué hicieron y cómo terminó. Empieza con:","en":"Tell it a case in spoken words, no structure: which client, what happened, what you did and how it ended. Start with:"},"say":{"es":"agrega un caso","en":"add a case"},"appears":{"es":"Un archivo en casos con las cinco partes: qué pasó, qué se hizo, cómo terminó, qué se aprendió y qué valor se aplicó. Si no contaste las dos últimas, te las pregunta.","en":"A file in the cases folder with the five parts: what happened, what was done, how it ended, what was learned and which value applied. If you left out the last two, it asks for them."},"check":{"es":"El archivo del caso tiene las cinco partes, incluidas la lección y el valor.","en":"The case file has all five parts, including the lesson and the value."}}]},{"id":"orden-y-roles","title":{"es":"Mantén la carpeta en orden","en":"Keep the folder in order"},"goal":{"es":"Corriste la revisión de la carpeta y cambiaste un rol, y viste que ambas cosas dejan rastro.","en":"You ran the folder review and changed a role, and saw that both leave a trail."},"cards":["put-the-folder-in-order","change-who-holds-a-role"],"steps":[{"do":{"es":"Escribe:","en":"Say:"},"say":{"es":"organiza la carpeta","en":"organize the folder"},"appears":{"es":"Un informe con fecha en la carpeta de auditorías dentro de salidas: qué archivó, qué pendientes encontró (transcripciones sin procesa
